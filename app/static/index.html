<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TradeInvestAgent 调试台</title>
<style>
  :root { --bg:#0f1420; --panel:#171d2b; --line:#26304a; --txt:#e6ebf5; --mut:#8a97b4; --acc:#5b8cff; --user:#2a3550; --ai:#1c2536; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 system-ui,"Segoe UI",sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  main { display:grid; grid-template-columns: 240px 1fr 340px; height:calc(100vh - 49px); }
  .threads { border-right:1px solid var(--line); overflow:auto; padding:8px; background:var(--panel); }
  .threads .th { padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:4px; border:1px solid transparent; position:relative; }
  .threads .th:hover { background:var(--bg); }
  .threads .th.active { background:var(--user); border-color:var(--acc); }
  .threads .th .t { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:20px; }
  .threads .th .m { font-size:11px; color:var(--mut); }
  .threads .th .del { position:absolute; right:6px; top:7px; width:18px; height:18px; line-height:16px; text-align:center; border-radius:5px; color:var(--mut); font-size:14px; }
  .threads .th .del:hover { background:#5b1f2a; color:#ff8a9a; }
  .chat { display:flex; flex-direction:column; border-right:1px solid var(--line); }
  .log { flex:1; overflow:auto; padding:20px; }
  .msg { margin-bottom:14px; padding:10px 14px; border-radius:10px; max-width:85%; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--user); margin-left:auto; }
  .ai { background:var(--ai); }
  .composer { display:flex; gap:8px; padding:12px 20px; border-top:1px solid var(--line); }
  .composer textarea { flex:1; resize:none; height:46px; padding:10px; background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:0 16px; cursor:pointer; font:inherit; }
  button:disabled { opacity:.5; cursor:default; }
  .ghost { background:transparent; color:var(--mut); border:1px solid var(--line); }
  aside { overflow:auto; padding:16px; background:var(--panel); }
  aside h2 { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:12px 0 8px; }
  .step { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:8px; background:var(--bg); }
  .step .role { font-size:11px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
  .step.assistant .role { color:var(--acc); } .step.user .role { color:#c8a2ff; } .step.tool .role { color:#5bd68a; }
  .step .tc { color:#ffcf6b; font-family:ui-monospace,monospace; font-size:12px; margin-top:4px; }
  .step .body { color:var(--mut); font-size:12px; margin-top:4px; max-height:160px; overflow:auto; }
  .rag .row { display:flex; justify-content:space-between; font-size:13px; padding:4px 0; border-bottom:1px dashed var(--line); }
  .muted { color:var(--mut); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>TradeInvestAgent 调试台</h1>
  <span class="tid muted" id="tid"></span>
  <span class="spacer"></span>
  <button class="ghost" onclick="newThread()">新会话</button>
  <button class="ghost" onclick="refreshAll()">刷新</button>
</header>
<main>
  <div class="threads" id="threads"></div>
  <section class="chat">
    <div class="log" id="log"></div>
    <div class="composer">
      <textarea id="input" placeholder="问点什么，回车发送 / Shift+回车换行"></textarea>
      <button id="send" onclick="send()">发送</button>
    </div>
  </section>
  <aside>
    <h2>工具轨迹</h2>
    <div id="trace"><div class="muted">选一个会话或发一条消息。</div></div>
    <h2>向量库 Collections</h2>
    <div id="rag" class="rag"></div>
  </aside>
</main>
<script>
let thread_id = localStorage.getItem("tid") || null;

function esc(s){ return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const log = document.getElementById("log");
function push(cls, text){ const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; }
document.getElementById("input").addEventListener("keydown", e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});

async function refreshAll(){ await loadThreads(); await loadRag(); if(thread_id) document.getElementById("tid").textContent="thread "+thread_id.slice(0,8); }

async function loadThreads(){
  const box = document.getElementById("threads");
  let d;
  try{
    const r = await fetch("/api/threads");
    if(!r.ok) throw new Error("HTTP "+r.status);
    d = await r.json();
  }catch(e){
    box.innerHTML='<div class="muted" style="padding:8px;color:#ff8a9a">加载会话失败: '+esc(String(e))+
      '<br>多半是 uvicorn 跑的是旧代码 → 重启服务并硬刷新(Ctrl+F5)</div>';
    return;
  }
  box.innerHTML="";
  if(!d.threads||!d.threads.length){ box.innerHTML='<div class="muted" style="padding:8px">暂无历史会话</div>'; return; }
  d.threads.forEach(t=>{
    const el=document.createElement("div"); el.className="th"+(t.thread_id===thread_id?" active":"");
    el.innerHTML='<div class="t">'+esc(t.title||"(无标题)")+'</div><div class="m">'+t.thread_id.slice(0,8)+' · '+t.count+' 条</div>';
    const del=document.createElement("span"); del.className="del"; del.title="删除此会话"; del.textContent="×";
    del.onclick=(e)=>{ e.stopPropagation(); delThread(t.thread_id); };
    el.appendChild(del);
    el.onclick=()=>openThread(t.thread_id);
    box.appendChild(el);
  });
}

async function delThread(tid){
  if(!confirm("删除该会话?此操作不可恢复。")) return;
  await fetch("/api/threads/"+encodeURIComponent(tid),{method:"DELETE"});
  if(tid===thread_id){ thread_id=null; localStorage.removeItem("tid"); log.innerHTML=""; document.getElementById("trace").innerHTML=""; document.getElementById("tid").textContent="(未选会话)"; }
  loadThreads();
}

async function openThread(tid){
  thread_id=tid; localStorage.setItem("tid",tid);
  document.getElementById("tid").textContent="thread "+tid.slice(0,8);
  const r = await fetch("/api/history/"+encodeURIComponent(tid)); const d = await r.json();
  log.innerHTML="";
  (d.trace||[]).forEach(s=>{
    if(s.role==="user"&&s.content) push("user", s.content);
    else if(s.role==="assistant"&&s.content) push("ai", s.content);
  });
  renderTrace(d.trace||[]);
  loadThreads();
}

function newThread(){
  thread_id = (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random());
  localStorage.setItem("tid", thread_id);
  document.getElementById("tid").textContent="thread "+thread_id.slice(0,8);
  log.innerHTML=""; document.getElementById("trace").innerHTML='<div class="muted">新会话，发一条消息开始。</div>';
  loadThreads();
}

async function send(){
  const ta=document.getElementById("input"); const prompt=ta.value.trim(); if(!prompt) return;
  if(!thread_id) newThread();
  ta.value=""; push("user", prompt);
  aiBubble=null; document.getElementById("trace").innerHTML="";
  const btn=document.getElementById("send"); btn.disabled=true;
  try{
    const r=await fetch("/api/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,thread_id})});
    const reader=r.body.getReader(); const dec=new TextDecoder(); let buf="";
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf("\n\n"))>=0){
        const frame=buf.slice(0,i); buf=buf.slice(i+2);
        if(!frame.startsWith("data: ")) continue;
        let ev; try{ ev=JSON.parse(frame.slice(6)); }catch(_){ continue; }
        handleEvent(ev);
      }
    }
  }catch(e){ push("ai", "请求出错: "+e); }
  finally{ btn.disabled=false; }
}

let aiBubble=null;
function handleEvent(ev){
  if(ev.type==="token"){
    if(!aiBubble){ aiBubble=document.createElement("div"); aiBubble.className="msg ai"; log.appendChild(aiBubble); }
    aiBubble.textContent+=ev.text; log.scrollTop=log.scrollHeight;
  } else if(ev.type==="tool_call"){
    liveStep("assistant","assistant", "▶ "+ev.name+"("+JSON.stringify(ev.args)+")");
  } else if(ev.type==="tool_result"){
    liveStep("tool","tool", ev.tool+" → "+ev.preview);
  } else if(ev.type==="final"){
    aiBubble=null; renderTrace(ev.trace||[]); if(ev.answer && !document.querySelector(".msg.ai")) push("ai", ev.answer);
    loadThreads(); loadRag();
  } else if(ev.type==="error"){
    push("ai","错误: "+ev.text);
  }
}

// 流式过程中往右栏即时追加一条(不重排),final 时再用完整 trace 覆盖
function liveStep(cls, role, text){
  const box=document.getElementById("trace");
  const d=document.createElement("div"); d.className="step "+cls;
  d.innerHTML='<div class="role">'+role+'</div><div class="body">'+esc(text)+'</div>';
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}

function renderTrace(trace){
  const box=document.getElementById("trace"); box.innerHTML="";
  trace.forEach(s=>{
    const d=document.createElement("div"); d.className="step "+s.role;
    let html='<div class="role">'+s.role+'</div>';
    if(s.tool_calls&&s.tool_calls.length) html+=s.tool_calls.map(tc=>'<div class="tc">▶ '+tc.name+'('+JSON.stringify(tc.args)+')</div>').join("");
    if(s.content) html+='<div class="body">'+esc(s.content)+'</div>';
    d.innerHTML=html; box.appendChild(d);
  });
}

async function loadRag(){
  try{ const d=await (await fetch("/api/rag")).json(); const box=document.getElementById("rag");
    box.innerHTML = d.collections.length ? d.collections.map(c=>'<div class="row"><span>'+esc(c.name)+'</span><span>'+c.count+' 块</span></div>').join("")
      : '<div class="muted">(空)</div>';
  }catch(e){}
}

// 初始:有存档的 thread 就回放它,否则等用户新建
if(thread_id){ openThread(thread_id); } else { document.getElementById("tid").textContent="(未选会话)"; }
loadThreads(); loadRag();
</script>
</body>
</html>
