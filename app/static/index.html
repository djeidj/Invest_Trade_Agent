<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeInvestAgent · A股投研助手</title>
<style>
  /* 极简桌面聊天布局:零依赖,重点是看懂流式渲染,不是颜值 */
  :root { --bg:#f5f6f8; --me:#2563eb; --line:#e4e6eb; --dim:#6b7280; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); font-family: system-ui, "Microsoft YaHei", sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:2px 0 0; color:var(--dim); font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:20px; }
  .wrap { max-width:780px; margin:0 auto; }
  .row { display:flex; margin:10px 0; }
  .row.me { justify-content:flex-end; }
  .bubble { max-width:80%; padding:10px 14px; border-radius:12px; background:#fff;
            border:1px solid var(--line); white-space:pre-wrap; line-height:1.6; }
  .me .bubble { background:var(--me); color:#fff; border:none; }
  .tool { font-family:Consolas, monospace; font-size:12px; color:var(--dim);
          white-space:pre-wrap; padding:2px 14px; }
  #inputbar { display:flex; gap:10px; padding:14px 20px; background:#fff;
              border-top:1px solid var(--line); }
  .inner { max-width:780px; margin:0 auto; display:flex; gap:10px; width:100%; }
  #q { flex:1; padding:10px 14px; border:1px solid var(--line); border-radius:10px;
       font-size:14px; outline:none; }
  #q:focus { border-color:var(--me); }
  button { padding:10px 22px; border:none; border-radius:10px; background:var(--me);
           color:#fff; font-size:14px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { max-width:780px; margin:8px auto 0; padding:0 20px; }
  .chip { display:inline-block; margin:0 8px 8px 0; padding:6px 12px; font-size:12px;
          background:#fff; border:1px solid var(--line); border-radius:999px;
          color:var(--dim); cursor:pointer; }
  .chip:hover { border-color:var(--me); color:var(--me); }
</style>
</head>
<body>
<header>
  <h1>TradeInvestAgent</h1>
  <p>A股投研 agent · 数据来自本地库 + 新闻语料检索,回答带引用,仅供参考不构成投资建议</p>
</header>

<div id="chat"><div class="wrap" id="feed"></div></div>

<div class="chips">
  <span class="chip" onclick="ask(this.textContent)">最近10天平安银行走势如何?</span>
  <span class="chip" onclick="ask(this.textContent)">对比茅台和宁德时代最近5天的表现</span>
  <span class="chip" onclick="ask(this.textContent)">语料里有没有关于i茅台APP维护的报道?</span>
</div>

<div id="inputbar"><div class="inner">
  <input id="q" placeholder="问点什么,回车发送…" onkeydown="if(event.key==='Enter')send()">
  <button id="btn" onclick="send()">发送</button>
</div></div>

<script>
/* 教学点1【收 SSE 不是收 JSON】:
   普通接口 await resp.json() 一次拿全量;流式接口的响应体是一个持续到达的
   字节流,必须用 getReader() 循环读。SSE 以空行(\n\n)分帧,但一个 chunk
   可能含半帧、多帧,甚至把一个汉字(UTF-8 3字节)劈成两半——所以:
   - TextDecoder 要开 {stream:true}:记住不完整的字节序列,下次续上
   - 手里留一个 buf 缓冲:凑齐 \n\n 才切一帧,切剩的留到下一轮
   这两处是流式前端最常见的 bug 来源。 */
const feed = document.getElementById("feed");
const chat = document.getElementById("chat");
const input = document.getElementById("q");
const btn = document.getElementById("btn");
let busy = false;

function scrollBottom() { chat.scrollTop = chat.scrollHeight; }
function addUser(text) {
  const d = document.createElement("div");
  d.className = "row me"; d.innerHTML = '<div class="bubble"></div>';
  d.firstChild.textContent = text;          // 用 textContent 防注入,不用 innerHTML
  feed.appendChild(d); scrollBottom();
}
function addAgent() {
  const d = document.createElement("div");
  d.className = "row"; d.innerHTML = '<div class="bubble"></div>';
  feed.appendChild(d); scrollBottom();
  return { bubble: d.firstChild, status: null };
}
function addToolLine(host, text) {
  if (!host.status) { host.status = document.createElement("div"); feed.appendChild(host.status); }
  const l = document.createElement("div");
  l.className = "tool"; l.textContent = text;
  host.status.appendChild(l); scrollBottom();
}
function ask(q) { input.value = q; send(); }

async function send() {
  const question = input.value.trim();
  if (!question || busy) return;
  busy = true; input.value = ""; btn.disabled = true;
  addUser(question);
  const host = addAgent();
  let text = "";

  function handle(ev) {
    if (ev.type === "token") {            // 增量文字 → 打字机效果
      text += ev.text; host.bubble.textContent = text; scrollBottom();
    } else if (ev.type === "tool_call") { // 工具活动 → 灰色状态行
      addToolLine(host, `> 调用 ${ev.name}(${ev.args})`);
    } else if (ev.type === "tool_result") {
      addToolLine(host, `  <- ${ev.preview}`);
    } else if (ev.type === "error") {
      text += "\n[出错] " + ev.text; host.bubble.textContent = text;
    } // final 不用单独处理:token 已拼出全文
  }

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {      // 凑齐一帧才处理
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (frame.startsWith("data: ")) handle(JSON.parse(frame.slice(6)));
      }
    }
  } catch (e) {
    host.bubble.textContent = text + "\n[连接失败] " + e.message + "(服务启动了吗?)";
  }
  busy = false; btn.disabled = false; input.focus();
}
</script>
</body>
</html>
