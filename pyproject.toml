[project]
name = "tradeinvestagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "akshare>=1.19.1",
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "langchain>=1.4.5",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "openai>=3.26.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
